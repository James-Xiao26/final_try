name: Refresh markets

# Keeps the Markets tab's data fresher than the daily full ingest. Cheap and global: a single Gamma
# API pass (general rate lane), independent of wallet processing and leaderboard_cache. Mirrors the
# --markets-only recovery path.
on:
  schedule:
    # Every 20 minutes. GitHub's scheduler drifts under load — fine, markets move slowly.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

# A slow run must not stack on the next tick.
concurrency:
  group: refresh-markets
  cancel-in-progress: false

jobs:
  refresh-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 22+ has a native global WebSocket; @supabase/supabase-js throws without one on Node 20.
          node-version: 22
          cache: pnpm
      # Only the scripts workspace runs here — skip installing the heavy web (next/react) deps.
      - run: pnpm install --frozen-lockfile --filter edgeboard-scripts
      - run: pnpm ingest:markets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
